<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>문제집 만들기(Math Sheet Studio)</title>
    <meta name="description" content="수식(LaTeX) 및 다양한 삽화 코드(TikZ, SVG, 이미지, 인라인)를 지능적으로 인식하여 고품질 인쇄용 문제집으로 조판하는 전문 솔루션" />
    <meta property="og:title" content="문제집 만들기(Math Sheet Studio)" />
    <meta property="og:description" content="수식(LaTeX) 및 다양한 삽화 코드(TikZ, SVG, 이미지, 인라인)를 지능적으로 인식하여 고품질 인쇄용 문제집으로 조판하는 전문 솔루션" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Typography: Noto Serif KR for exam print, Noto Sans KR for UI, JetBrains Mono for code -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700;900&display=swap" rel="stylesheet">

    <!-- MathJax 3 configuration -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true,
          packages: {'[+]': ['ams', 'color', 'mathtools', 'physics']}
        },
        svg: { fontCache: 'global' },
        options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
      };
    </script>
    <script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js"></script>

    <!-- Local high-performance TikZJax (instant local loading, 0 network latency, pre-cached WebAssembly) -->
    <link rel="stylesheet" href="/tikzjax/fonts.css">
    <script>
      window.__tikzJaxLoaded = false;
      window.__tikzJaxPromise = null;
      window.ensureTikZJax = function() {
        if (window.__tikzJaxLoaded || window.TikzJax) return Promise.resolve(true);
        if (window.__tikzJaxPromise) return window.__tikzJaxPromise;

        window.__tikzJaxPromise = new Promise(function(resolve) {
          // Check if already initialized by script tag
          if (window.__tikzJaxLoaded || window.TikzJax) {
            resolve(true);
            return;
          }

          var script = document.createElement('script');
          script.src = '/tikzjax/tikzjax.js';
          script.async = true;
          script.onload = function() {
            window.__tikzJaxLoaded = true;
            resolve(true);
          };
          script.onerror = function() {
            // Secondary fallback to CDN if local bundle fails
            var cdn = document.createElement('script');
            cdn.src = 'https://cdn.jsdelivr.net/npm/@planktimerr/tikzjax@1.0.8/dist/tikzjax.js';
            cdn.async = true;
            cdn.onload = function() {
              window.__tikzJaxLoaded = true;
              resolve(true);
            };
            document.head.appendChild(cdn);
          };
          document.head.appendChild(script);
        });
        return window.__tikzJaxPromise;
      };
    </script>
    <script async src="/tikzjax/tikzjax.js" onload="window.__tikzJaxLoaded = true;"></script>
  </head>
  <body class="bg-stone-100 text-stone-900 min-h-screen font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
