<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>문제집 만들기(Math Sheet Studio)</title>
    <meta name="description" content="수식(LaTeX) 및 다양한 삽화 코드(TikZ, SVG, 이미지, 인라인)를 지능적으로 인식하여 고품질 인쇄용 문제집으로 조판하는 전문 솔루션" />
    <meta property="og:title" content="수식·삽화 문제집 조판 및 인쇄 도구 (Math Sheet Studio)" />
    <meta property="og:description" content="수식(LaTeX) 및 다양한 삽화 코드(TikZ, SVG, 이미지, 인라인)를 지능적으로 인식하여 고품질 인쇄용 문제집으로 조판하는 전문 솔루션" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Typography: Noto Serif KR for exam print, Noto Sans KR for UI, JetBrains Mono for code -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700;900&display=swap" rel="stylesheet">

    <!-- MathJax 3 configuration -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true,
          packages: {'[+]': ['ams', 'color', 'mathtools', 'physics']}
        },
        svg: { fontCache: 'global' },
        options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
      };
    </script>
    <script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js"></script>

    <!-- TikZJax fonts & lazy loader with multi-CDN fallback -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@planktimerr/tikzjax@1.0.7/dist/fonts.css">
    <script>
      window.__tikzJaxLoaded = false;
      window.__tikzJaxPromise = null;
      window.ensureTikZJax = function() {
        if (window.__tikzJaxLoaded) return Promise.resolve(true);
        if (window.__tikzJaxPromise) return window.__tikzJaxPromise;

        var sources = [
          'https://cdn.jsdelivr.net/npm/@planktimerr/tikzjax@1.0.7/dist/tikzjax.js',
          'https://unpkg.com/@planktimerr/tikzjax@1.0.7/dist/tikzjax.js',
          'https://tikzjax.com/v1/tikzjax.js'
        ];

        window.__tikzJaxPromise = new Promise(function(resolve, reject) {
          var index = 0;
          var lastError = null;
          function tryNext() {
            if (window.__tikzJaxLoaded) {
              resolve(true);
              return;
            }
            if (index >= sources.length) {
              window.__tikzJaxPromise = null;
              reject(lastError || new Error('TikZJax 외부 스크립트를 불러올 수 없습니다. 네트워크 환경을 확인하세요.'));
              return;
            }
            var src = sources[index++];
            var script = document.createElement('script');
            script.src = src;
            script.async = true;
            script.onload = function() {
              window.__tikzJaxLoaded = true;
              resolve(true);
            };
            script.onerror = function() {
              lastError = new Error('TikZJax CDN 접속 불가: ' + src);
              tryNext();
            };
            document.head.appendChild(script);
          }
          tryNext();
        });
        return window.__tikzJaxPromise;
      };
    </script>
  </head>
  <body class="bg-stone-100 text-stone-900 min-h-screen font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
